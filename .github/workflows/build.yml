name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Missing Wrapper & Setup Environment
        run: |
          # Generate fresh Gradle wrapper files
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # Create environment stubs for Secrets Gradle Plugin
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=dummy_placeholder_key" > .env
          echo "GEMINI_API_KEY=dummy_placeholder_key" > .env.example
          
          # Remove desktop debugConfig signing line that causes build failures
          sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraFocus-App
          path: app/build/outputs/apk/debug/*.apk
